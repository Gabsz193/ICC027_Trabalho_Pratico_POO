<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Página Inicial</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/login.css}">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-container" style="max-width: 800px; width: 90%;">

            <h2>Bem-vindo, <span sec:authentication="name">Usuário</span>!</h2>
            
            <div th:if="${mensagem}" style="color: green; margin-bottom: 10px;">
                <p th:text="${mensagem}"></p>
            </div>
            <div th:if="${erro}" style="color: red; margin-bottom: 10px;">
                <p th:text="${erro}"></p>
            </div>

            <p>Saldo: R$ <span th:text="${#numbers.formatDecimal(usuario.saldoCentavos / 100.0, 1, 2)}">0,00</span></p>

            <div sec:authorize="hasRole('ADMIN')" style="margin-top: 10px; margin-bottom: 10px;">
                <a th:href="@{/admin}" style="background-color: #007bff; color: white; padding: 10px 15px; text-decoration: none; border-radius: 5px; display: inline-block;">Acessar Painel Administrativo</a>
            </div>

            <hr>

            <h3>Comprar Ticket</h3>
            <form th:action="@{/comprar-ticket}" method="post" style="display: flex; flex-direction: column; gap: 10px;">
                <label>
                    Unidade:
                    <select name="unidadeId" required>
                        <option value="" disabled selected>Selecione uma unidade</option>
                        <option th:each="unidade : ${unidades}" th:value="${unidade.id}" th:text="${unidade.nome}"></option>
                    </select>
                </label>
                <label>
                    Tipo de Refeição:
                    <select name="tipoRefeicao" required>
                        <option value="" disabled selected>Selecione o tipo</option>
                        <option th:each="tipo : ${tiposRefeicao}" th:value="${tipo}" th:text="${tipo}"></option>
                    </select>
                </label>
                <p>Valor: R$ 2,50</p>
                <button type="submit">Comprar</button>
            </form>

            <hr>

            <h3>Refeições em Posse</h3>
            <div th:if="${tickets.empty}">
                <p>Você não possui tickets ativos.</p>
            </div>
            <div th:each="ticket : ${tickets}" style="border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; border-radius: 5px; display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <strong th:text="${ticket.tipoRefeicao}">ALMOCO</strong> - 
                    <span th:text="${ticket.unidade.nome}">Unidade</span><br>
                    <small>Válido até: <span th:text="${#temporals.format(ticket.dataValidade, 'dd/MM/yyyy')}">Data</span></small>
                </div>
                <button type="button" th:onclick="'openTicketModal(' + ${ticket.id} + ')'">Ver Ticket</button>
            </div>

            <form th:action="@{/logout}" method="post" style="margin-top: 20px;">
                <button type="submit" style="background-color: #dc3545;">Sair (Logout)</button>
            </form>

        </div>
    </div>

    <!-- Modal Ticket -->
    <div id="ticketModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center;">
        <div style="background: white; padding: 20px; border-radius: 8px; text-align: center; max-width: 300px; width: 100%;">
            <h3>Ticket #<span id="modalTicketIdDisplay"></span></h3>
            <img id="qrCodeImage" src="" alt="QR Code" style="width: 150px; height: 150px; margin: 10px 0;">
            
            <form th:action="@{/consumir-ticket}" method="post">
                <input type="hidden" name="ticketId" id="modalTicketIdInput">
                <button type="submit" style="background-color: #28a745; margin-bottom: 10px;">Consumir</button>
            </form>
            
            <button type="button" onclick="closeTicketModal()" style="background-color: #6c757d;">Fechar</button>
        </div>
    </div>

    <script>
        function openTicketModal(ticketId) {
            document.getElementById('modalTicketIdDisplay').innerText = ticketId;
            document.getElementById('modalTicketIdInput').value = ticketId;
            document.getElementById('qrCodeImage').src = 'https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=' + ticketId;
            document.getElementById('ticketModal').style.display = 'flex';
        }

        function closeTicketModal() {
            document.getElementById('ticketModal').style.display = 'none';
        }
    </script>
</body>
</html>
